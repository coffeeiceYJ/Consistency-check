[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory-reqcheck"
version = "0.1.0"
description = "Independent requirement and PlantUML consistency checker with LiSSA retrieval"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
reqcheck = "reqcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
